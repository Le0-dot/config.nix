name: "Deploy nix flake to remote system"
on:
  push:
    branches: [deploy/**]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Resolve host from branch name
      run: echo "HOST=${GITHUB_REF_NAME#deploy/}" >> "$GITHUB_ENV"
    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
        ping: ${{ env.HOST }}
    - name: Trigger nixos-upgrade.service
      run: tailscale ssh "ci@$HOST" 'systemctl start nixos-upgrade.service'
