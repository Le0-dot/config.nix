name: "Update nix flake inputs"
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Check out git repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Install nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
    - name: Run update command
      run: nix flake update
    - name: Create pull request
      id: create-pr
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
      with:
        token: ${{ secrets.OWNER_PAT }}
        base: main
        branch: automation/update
        delete-branch: true
        title: "Flake update"
        commit-message: "flake update"
        body: This pull request was created automatically by the update workflow.
    - name: Enable auto-merge
      if: steps.create-pr.outputs.pull-request-number != ''
      env:
       GH_TOKEN: ${{ secrets.OWNER_PAT }}
      run: |
       gh pr merge \
         "${{ steps.create-pr.outputs.pull-request-number }}" \
         --auto \
         --squash
