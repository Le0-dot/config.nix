name: "Run checks for nix flake"
on: 
  push:
    branches: [main]
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Check out git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
    - name: Check formatting
      run: nix fmt -- --ci
    - name: Run checks
      run: nix flake check
