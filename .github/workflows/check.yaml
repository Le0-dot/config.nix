name: "Run checks for nix flake"
on: 
  push:
    branches: [main]
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Check out git repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Install nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
    - name: Check formatting
      run: nix fmt -- --ci
    - name: Run checks
      run: nix flake check
