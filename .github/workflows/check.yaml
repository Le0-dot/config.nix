name: "Run checks for nix flake"
on: 
  push:
    branches: [main]
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Check out git repository
      uses: actions/checkout@v5
    - name: Install nix
      uses: cachix/install-nix-action@v31
    - name: Run checks
      run: nix flake check
