name: "Deploy all servers on merge"
on:
  pull_request:
    types: [closed]
    branches: [main]
jobs:
  deploy:
    if: github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        parameter: [nu, tau]
    uses: ./.github/workflows/deploy.yaml
    with:
      host: ${{ matrix.parameter }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
